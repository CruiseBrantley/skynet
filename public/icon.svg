<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#0f1117" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2" />
      <stop offset="100%" stop-color="#7983f5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="115" fill="url(#bg)" stroke="#30363d" stroke-width="12" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#30363d" stroke-width="16" stroke-dasharray="12 12" />
  
  <!-- Cyber Eye / Core -->
  <circle cx="256" cy="256" r="90" fill="#161b22" stroke="url(#accent)" stroke-width="18" filter="url(#glow)" />
  
  <!-- Center Pupil Indicator -->
  <circle cx="256" cy="256" r="42" fill="url(#accent)" />
  <circle cx="256" cy="256" r="18" fill="#f0f6fc" />
  
  <!-- Radar Crosshairs -->
  <path d="M256 40 L256 120 M256 392 L256 472 M40 256 L120 256 M392 256 L472 256" stroke="#5865f2" stroke-width="10" stroke-linecap="round" opacity="0.8" />
</svg>